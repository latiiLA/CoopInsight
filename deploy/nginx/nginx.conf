# Switch Hub — run from the repo root so relative paths resolve:
#
#   nginx -p "$(pwd)" -c deploy/nginx/nginx.conf
#
# Prerequisites: frontend/dist built, API on https://127.0.0.1:8088,
# certificates/selfsigned.crt + certificates/selfsigned.key present.

worker_processes auto;

error_log tmp/nginx-error.log warn;
pid       tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Linux package nginx. On a custom build, point this at your mime.types.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    access_log tmp/nginx-access.log;

    upstream coopinsight_api {
        server 127.0.0.1:8088;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate     certificates/selfsigned.crt;
        ssl_certificate_key certificates/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root  frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass https://coopinsight_api;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /health {
            proxy_pass https://coopinsight_api/health;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }

        location /uploads/ {
            proxy_pass https://coopinsight_api;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
